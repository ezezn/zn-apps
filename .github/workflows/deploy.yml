name: Desplegar Multi-PWA Monorepo a GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # descargar el artefacto del despliegue anterior

# Un despliegue de Pages a la vez. No se cancela el que está en curso:
# cortar un deploy a mitad deja el artefacto publicado en estado inconsistente.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Job de build: compila lo necesario y publica dist/ como artefacto "github-pages".
  build:
    runs-on: ubuntu-latest
    steps:
      # Paso 1: Descargar el código del repositorio
      # `fetch-depth: 0` da acceso al commit anterior del push, necesario para
      # detectar qué apps y librerías cambiaron.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Paso 2: Configurar el entorno de Node 24
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      # Paso 3: Instalar dependencias (crea node_modules en todo el monorepo)
      - name: Instalar Dependencias del Monorrepo
        run: npm install

      # Paso 4: Ejecutar Tests Unitarios en el Monorrepo
      - name: Ejecutar Tests Unitarios
        run: npm run test:run

      # Paso 5: Recuperar el sitio publicado para conservar las apps que no
      # se recompilan. Si no hay artefacto previo, el build selectivo cae a
      # `build:production` automáticamente.
      - name: Restaurar Despliegue Anterior
        id: restore
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow=deploy.yml --branch=main --status=success \
            --limit=1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "No hay despliegue previo que restaurar."
            exit 1
          fi
          rm -rf .previous-site && mkdir -p .previous-site dist
          gh run download "$run_id" -n github-pages -D .previous-site
          if [ -f .previous-site/artifact.tar ]; then
            tar -xf .previous-site/artifact.tar -C dist
          else
            cp -R .previous-site/. dist/
          fi
          test -f dist/index.html

      # Solo compilan las apps y librerías tocadas por el push. Los sprites se
      # generan localmente con `npm run build:icons` y se versionan; el build
      # de producción nunca los regenera.
      - name: Compilar Apps y Librerías Modificadas
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          RESTORE_OK: ${{ steps.restore.outcome == 'success' && '1' || '0' }}
        run: node scripts/build-changed.mjs

      - name: Validar PWA
        run: npm run validate:pwa

      # Paso 6: Comprobar que dist/ tiene contenido. Si el build "pasa" pero no
      # deja archivos, el fallo se veía recién en deploy-pages como
      # "No artifacts named github-pages were found", que no dice nada del build.
      - name: Verificar Salida del Build
        run: |
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::dist/ está vacío: upload-pages-artifact no tendría nada que publicar."
            exit 1
          fi
          echo "Contenido de dist/:"
          ls -1 dist
          # Pages rechaza artefactos con enlaces simbólicos o duros.
          if find dist -type l | grep -q .; then
            echo "::error::dist/ contiene enlaces simbólicos y GitHub Pages no los admite."
            find dist -type l
            exit 1
          fi

      # Paso 7: Copiar los enrutamientos de error 404 de cada PWA presente
      - name: Inyectar Enrutamientos Fallback 404
        run: |
          for app_dir in dist/*/; do
            if [ -f "${app_dir}index.html" ]; then
              cp "${app_dir}index.html" "${app_dir}404.html"
            fi
          done
          cp dist/index.html dist/404.html

      # Paso 8: Empaquetar dist/ como el artefacto "github-pages"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

  # Job de deploy: sólo corre si el build subió el artefacto correctamente.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
