name: Desplegar Multi-PWA Monorepo a GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue de Pages a la vez. No se cancela el que está en curso:
# cortar un deploy a mitad deja el artefacto publicado en estado inconsistente.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Job de build: compila el monorepo y publica dist/ como artefacto "github-pages".
  build:
    runs-on: ubuntu-latest
    steps:
      # Paso 1: Descargar el código del repositorio
      - uses: actions/checkout@v4

      # Paso 2: Configurar el entorno de Node 24
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      # Paso 3: Instalar dependencias (crea node_modules en todo el monorepo)
      - name: Instalar Dependencias del Monorrepo
        run: npm install

      # Paso 4: Ejecutar Tests Unitarios en el Monorrepo
      - name: Ejecutar Tests Unitarios
        run: npm run test:run

      # Los sprites se generan localmente con `npm run build:icons` y se versionan.
      # El build de producción solo consume los archivos del repositorio.
      - name: Ejecutar Compilación Unificada
        run: npm run build:production

      # Paso 5: Comprobar que dist/ tiene contenido. Si el build "pasa" pero no
      # deja archivos, el fallo se veía recién en deploy-pages como
      # "No artifacts named github-pages were found", que no dice nada del build.
      - name: Verificar Salida del Build
        run: |
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::dist/ está vacío: upload-pages-artifact no tendría nada que publicar."
            exit 1
          fi
          echo "Contenido de dist/:"
          ls -1 dist
          # Pages rechaza artefactos con enlaces simbólicos o duros.
          if find dist -type l | grep -q .; then
            echo "::error::dist/ contiene enlaces simbólicos y GitHub Pages no los admite."
            find dist -type l
            exit 1
          fi

      # Paso 6: Copiar los enrutamientos de error 404 de cada PWA
      - name: Inyectar Enrutamientos Fallback 404
        run: |
          cp dist/zound-box/index.html dist/zound-box/404.html
          cp dist/kitchensink/index.html dist/kitchensink/404.html
          cp dist/daily-task-report/index.html dist/daily-task-report/404.html
          cp dist/index.html dist/404.html

      # Paso 7: Empaquetar dist/ como el artefacto "github-pages"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

  # Job de deploy: sólo corre si el build subió el artefacto correctamente.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
